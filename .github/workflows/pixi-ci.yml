name: CI Workflow with Pixi

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
  # Execute a nightly build at 2 AM UTC.
  - cron: '0 2 * * *'

jobs:
  build:
    name: '[${{ matrix.os }}@Release@pixi]'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - uses: actions/checkout@v5

    - uses: prefix-dev/setup-pixi@v0.11.2
      with:
        pixi-version: v0.82.1
        # This repository intentionally does not commit pixi.lock.
        locked: false
        cache: false

    - name: Build
      run: pixi run build

    - name: Check version consistency
      run: pixi run check-version-consistency

    - name: Test
      run: pixi run test

    - name: Check installed CMake package
      run: pixi run cmake-check
